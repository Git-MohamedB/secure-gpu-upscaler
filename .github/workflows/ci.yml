name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          pip install fastapi==0.111.0 uvicorn==0.30.1 opencv-python-headless==4.10.0.84 numpy==1.26.4 scikit-image==0.24.0 pydantic==2.8.2 pillow==10.4.0 pytest==8.2.2 httpx==0.28.1 python-multipart==0.0.33 ruff
      - name: Lint with ruff
        run: ruff check --select E4,E7,E9,F --ignore E402 app tests scripts
      - name: Bytecode syntax check
        run: python -m compileall app tests scripts
      - name: Run ingestion, weights integrity, and CPU API integration tests
        run: |
          pytest tests/test_pipeline.py -k "test_reject_oversized_file or test_reject_oversized_dimensions" -v
          pytest tests/test_api_cpu.py tests/test_download_weights.py -v
      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
