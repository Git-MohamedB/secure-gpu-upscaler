name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          pip install fastapi==0.111.0 uvicorn==0.30.1 opencv-python-headless==4.10.0.84 numpy==1.26.4 scikit-image==0.24.0 pydantic==2.8.2 pillow==10.4.0 pytest==8.2.2 httpx python-multipart
      - name: Bytecode syntax check
        run: python -m compileall app tests scripts
      - name: Run ingestion and DoS defense unit tests
        run: pytest tests/test_pipeline.py -k "test_reject_oversized_file or test_reject_oversized_dimensions" -v
