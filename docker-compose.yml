services:
  upscaler:
    build: .
    image: secure-gpu-upscaler:latest
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ./weights:/app/weights:ro
    # Réservation GPU
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Quotas cgroups
    mem_limit: 4g
    cpus: 2.0
    # Durcissement
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

